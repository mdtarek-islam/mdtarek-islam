name: Daily portfolio sync

on:
  schedule:
    # 08:00 UTC each day. See docs/MAINTENANCE.md.
    - cron: '0 8 * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: daily-portfolio-sync
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out the repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: .github/workflows/daily-portfolio-sync.yml

      - name: Install dependencies
        run: python -m pip install requests pytest

      - name: Test the scripts
        run: |
          python -m unittest discover -s scripts -p "test_*.py"
          python -m pytest tests

      - name: Run the sync
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PROFILE_STATS_TOKEN: ${{ secrets.PROFILE_STATS_TOKEN }}
          EXCLUDE_REPOS: ${{ secrets.EXCLUDE_REPOS }}
        run: python scripts/portfolio_sync.py

      - name: Validate the generated files
        run: |
          python - <<'PY'
          import pathlib, sys
          import xml.etree.ElementTree as ET
          bad = 0
          for svg in sorted(pathlib.Path("assets").rglob("*.svg")):
              try:
                  ET.parse(svg)
              except ET.ParseError as exc:
                  print(f"Invalid SVG: {svg}: {exc}")
                  bad = 1
          readme = pathlib.Path("README.md").read_text(encoding="utf-8")
          for mark in ("<!-- SHOWCASE:START -->", "<!-- SHOWCASE:END -->"):
              if mark not in readme:
                  print(f"README lost the marker {mark}")
                  bad = 1
          sys.exit(bad)
          PY

      - name: Commit changes
        run: |
          if [ -z "$(git status --porcelain -- README.md assets)" ]; then
            echo "Nothing changed."
            exit 0
          fi
          git config user.name "MD Tarek Islam"
          git config user.email "md.tarek.mlearn@gmail.com"
          git add README.md assets
          git commit -m "chore(profile): daily portfolio sync"
          git push origin HEAD:main

      - name: Check README links
        continue-on-error: true
        run: |
          grep -oE 'https://(raw\.githubusercontent\.com|github\.com)/mdtarek-islam/[^")<> ]+' README.md \
            | sort -u | while read -r url; do
              code="$(curl -s -o /dev/null -w '%{http_code}' -L "$url")"
              if [ "$code" != "200" ]; then echo "::warning::Broken link $url ($code)"; fi
            done
