name: Update London skyline

on:
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: update-skyline
  cancel-in-progress: false

jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out the repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Test the generator
        run: python -m unittest discover -s scripts -p "test_*.py"

      - name: Render the skyline from the GitHub API
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python scripts/generate_skyline.py --login "${{ github.repository_owner }}" --output assets/london-skyline.svg

      - name: Commit the skyline if it changed
        run: |
          if git diff --quiet -- assets/london-skyline.svg; then
            echo "The skyline has not changed."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/london-skyline.svg
          git commit -m "chore: update London skyline contribution graph"
          git push
