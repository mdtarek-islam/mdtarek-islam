<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 260" width="960" height="260" role="img" aria-labelledby="hb-title hb-desc"><title id="hb-title">Md Tarek Islam, machine learning engineer</title><desc id="hb-desc">Night drive through London. The name Md Tarek Islam and the role line, machine learning engineer: recommender systems, computer vision and serverless ML, sit in a night sky above a London skyline with the London Eye, the Gherkin, Tower Bridge and the Shard. Road markings and car lights move along the road below.</desc><style>
text{font-family:-apple-system,"Segoe UI",Helvetica,Arial,sans-serif}
.name{fill:#e6edf3;font-size:40px;font-weight:600}
.role{fill:#8b949e;font-size:16px}
.lm{fill:#161b22;stroke:#8b949e;stroke-opacity:.4;stroke-width:1}
.ln{fill:none;stroke:#8b949e;stroke-opacity:.4;stroke-width:1}
.cap{fill:#8b949e;fill-opacity:.55}
.st{fill:#8b949e}
.moon{fill:#e6edf3;fill-opacity:.85}
.eye{transform-box:fill-box;transform-origin:center;animation:spin 150s linear infinite}
.bc{fill:#f85149;animation:blink 2.4s ease-in-out infinite}
.blk{fill:#0d1117;stroke:#30363d;stroke-width:1}
.win{fill:#e3b341;fill-opacity:.7}
.fl{animation:flicker 6.5s ease-in-out infinite}
.road{fill:#161b22}
.kerb{fill:none;stroke:#30363d;stroke-width:1}
.mark{fill:none;stroke:#d29922;stroke-width:2;stroke-dasharray:18 22;animation:mark 1.1s linear infinite}
.hl{fill:#e6edf3}
.hb{fill:#e6edf3;fill-opacity:.18}
.tl{fill:#f85149}
.tt{fill:#f85149;fill-opacity:.3}
.east{animation:east 5s linear infinite}
.west{animation:west 6.5s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes blink{0%,100%{opacity:1}50%{opacity:.15}}
@keyframes flicker{0%,100%{opacity:1}50%{opacity:.45}}
@keyframes mark{to{stroke-dashoffset:40}}
@keyframes east{from{transform:translateX(-320px)}to{transform:translateX(0)}}
@keyframes west{from{transform:translateX(0)}to{transform:translateX(-320px)}}
@media (prefers-reduced-motion: reduce){*{animation:none!important}}
